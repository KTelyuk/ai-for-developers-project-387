name: claude

# Агент Claude Code отвечает на команду @claude в комментариях к issue и PR.
# Описание: README.md, раздел «Агент в GitHub».
on:
  # Триггер нужен по заданию. Автора проверяет `if` ниже (OWNER/MEMBER/COLLABORATOR, не бот),
  # PR из форков отключены, а запускать агента и его тесты на ветке могут только участники с правом записи.
  issue_comment: # jactionlint ignore=dangerous-triggers
    types: [created]
  pull_request_review_comment:
    types: [created]

# По названию прогона gate находит в истории Actions запуски того же PR.
# Название строится только из события, а не из текста комментария.
run-name: >-
  ${{ format('claude {0} #{1}',
  (github.event.pull_request || github.event.issue.pull_request) && 'PR' || 'issue',
  github.event.pull_request.number || github.event.issue.number) }}

# Один прогон на issue или PR: следующая команда ждёт, пока закончится текущая.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Предел запусков агента на один PR, без модели и секретов. Счётчик — история Actions:
  # допущенным считается попытка прогона, в которой gate выполнил шаг «Admit run».
  # Сюда входят завершённые, отменённые, упавшие по таймауту прогоны и повторы через Re-run
  # (каждая попытка `run_attempt` отдельно). Комментарии PR счётчик не меняют.
  gate:
    # Модель вызывается, только если в комментарии есть команда, автор — доверенный участник
    # репозитория, а не бот.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      allowed: ${{ steps.count.outputs.allowed }}
      used: ${{ steps.count.outputs.used }}
      limit: ${{ steps.count.outputs.limit }}
      note: ${{ steps.count.outputs.note }}
      attempt: ${{ steps.count.outputs.attempt }}
    steps:
      - name: Count agent runs on this PR
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: '3'
          IS_PR: ${{ (github.event.pull_request || github.event.issue.pull_request) && 'true' || 'false' }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          SINCE: ${{ github.event.pull_request.created_at || github.event.issue.created_at }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          out attempt "$GITHUB_RUN_ATTEMPT"
          out limit "$LIMIT"

          # На обычных issue предел не действует: там идёт разговор (триаж, to-spec, to-tickets),
          # и каждый ответ на вопрос агента — новый вызов. Один прогон ограничивают таймаут и --max-turns.
          if [ "$IS_PR" != true ]; then
            out allowed true
            out used 0
            exit 0
          fi

          api="repos/$GITHUB_REPOSITORY/actions/workflows/claude.yml/runs"
          runs="$RUNNER_TEMP/runs.tsv"
          list_runs() {
            gh api "$api?created=%3E%3D$SINCE&per_page=100" --paginate \
              --jq '.workflow_runs[] | [.id, .run_number, (.conclusion // "-"), .display_title] | @tsv' > "$runs"
          }

          # Токен приложения Claude может удалять прогоны (у приложения actions: write).
          # Номера прогонов идут подряд и не переиспользуются, поэтому удаление видно по дыре
          # в номерах от последнего прогона до PR до текущего. Тогда gate закрывается: нужен человек.
          # Более новые прогоны (другие обсуждения, или это повтор старого прогона через
          # «Re-run all jobs») не проверяются: они не нужны, чтобы посчитать запуски до текущего.
          contiguous() {
            local prev
            prev=$(gh api "$api?created=%3C$SINCE&per_page=1" --jq '.workflow_runs[0].run_number // 0')
            cut -f2 "$runs" | sort -n | uniq | awk -v prev="$prev" -v cur="$RUN_NUMBER" '
              $1 > cur { next }
              { if ($1 != prev + 1) bad = 1; prev = $1 }
              END { exit (bad || prev != cur) }'
          }

          list_runs
          if ! contiguous; then
            # Только что созданный прогон может появиться в списке с задержкой.
            sleep 15
            list_runs
            if ! contiguous; then
              echo "::error::History of claude.yml runs has gaps since the PR was opened"
              out allowed false
              out used '?'
              out note 'в истории Actions не хватает прогонов этого воркфлоу (удалены?), поэтому счётчик нельзя проверить'
              exit 0
            fi
          fi

          used=0
          while IFS=$'\t' read -r id _ conclusion title; do
            [ "$title" = "claude PR #$NUMBER" ] || continue
            # Комментарий без команды даёт прогон со всеми пропущенными заданиями: gate в нём
            # не выполнялся, а jobs API для такого прогона отвечает 404.
            [ "$conclusion" != skipped ] || continue
            # filter=all — все попытки прогона. Gate текущей попытки ещё не завершён и не считается.
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=all&per_page=100" --paginate \
              --jq '.jobs[] | select(.name == "gate" and .status == "completed")
                | select(any(.steps[]?; .name == "Admit run" and .conclusion == "success")) | .id' | wc -l)
            used=$((used + n))
          done < "$runs"

          echo "Agent runs admitted on PR #$NUMBER: $used of $LIMIT"
          out used "$used"
          if [ "$used" -lt "$LIMIT" ]; then
            out allowed true
          else
            out allowed false
            out note "бюджет PR исчерпан: агент уже запускался $used раз(а) из $LIMIT"
          fi

      # Отметка допуска: её успешное выполнение и есть запись в счётчике.
      - name: Admit run
        if: steps.count.outputs.allowed == 'true'
        run: echo "Agent run admitted"

  claude:
    needs: gate
    # Повтор через «Re-run failed jobs» не перезапускает gate, поэтому агент запускается,
    # только если gate допустил именно эту попытку. Для повтора нужен «Re-run all jobs».
    if: needs.gate.outputs.allowed == 'true' && needs.gate.outputs.attempt == github.run_attempt
    runs-on: ubuntu-latest
    # Это значение повторяет задание report: по нему оно отличает таймаут от других сбоев.
    timeout-minutes: 40
    # Писать в репозиторий агент будет токеном Claude GitHub App, а не GITHUB_TOKEN.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - name: Check secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN is not set"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история: implement-spec создаёт интеграционную ветку и сливает в неё тикеты.
          fetch-depth: 0
          persist-credentials: false

      # Node.js, gh и зависимости проекта (хук postinstall → npm ci): агенту нужны тесты, линтеры и генерация.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Run agent
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          # Параметр есть в закреплённой версии (action.yml), но каталог jactionlint его ещё не знает.
          allow_fork_prs: 'false' # jactionlint ignore=unknown-action-input
          additional_permissions: |
            actions: read
          # Скиллы to-spec, to-tickets, implement-spec и другие с disable-model-invocation модель сама не выбирает.
          # Комментарий доверенного участника с прямой просьбой запустить скилл — это ручной вызов человеком,
          # поэтому агент читает SKILL.md и выполняет его шаги.
          # Воркфлоу агент не правит: комментарий к строке diff запускает claude.yml из ветки PR,
          # и правка воркфлоу в PR обошла бы gate.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 80
            --append-system-prompt "Если в комментарии участник прямо просит запустить скилл проекта по имени (например: запусти скилл to-spec), это ручной вызов скилла человеком, как команда /to-spec в локальной сессии. Прочитай .claude/skills/ИМЯ/SKILL.md и выполни его шаги, даже если в нём стоит disable-model-invocation: true. Трекер и правила публикации описаны в docs/agents/. Вопросы, которые скилл велит задать пользователю, задай комментарием в issue и закончи работу: ответ придёт следующим вызовом. Скиллы, о которых участник не просил, сам не запускай."
            --allowedTools "Skill,Agent,Task,Read,Glob,Grep,Edit,Write,Bash(gh issue:*),Bash(gh label list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(mise exec -- gh issue:*),Bash(mise run lint:*),Bash(mise run format:*),Bash(mise run typecheck:*),Bash(mise run test:*),Bash(mise run build:*),Bash(mise run generate:*),Bash(mise run check-generated:*),Bash(npm test:*),Bash(git log:*),Bash(git diff:*),Bash(git status:*),Bash(git show:*),Bash(git branch:*),Bash(git switch:*),Bash(git checkout:*),Bash(git merge:*),Bash(git worktree:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*)"
            --disallowedTools "Edit(.github/workflows/**),Write(.github/workflows/**)"

  # Отчёт без модели: если агент не ответил, человек видит причину в обсуждении.
  # Отдельное задание со своим таймаутом успевает выполниться и после таймаута агента.
  report:
    needs: [gate, claude]
    if: always() && needs.gate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Publish failure reason
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.gate.result }}
          CLAUDE_RESULT: ${{ needs.claude.result }}
          ALLOWED: ${{ needs.gate.outputs.allowed }}
          USED: ${{ needs.gate.outputs.used }}
          LIMIT: ${{ needs.gate.outputs.limit }}
          NOTE: ${{ needs.gate.outputs.note }}
          GATE_ATTEMPT: ${{ needs.gate.outputs.attempt }}
          IS_PR: ${{ (github.event.pull_request || github.event.issue.pull_request) && 'true' || 'false' }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          AGENT_TIMEOUT_MINUTES: '40'
        run: |
          set -euo pipefail
          details=""
          if [ "$GATE_RESULT" != success ]; then
            reason=infra
            details="gate не смог посчитать запуски"
          elif [ "$ALLOWED" != true ]; then
            reason=limit_exhausted
            details="$NOTE. Модель не вызывалась"
          elif [ "$GATE_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            reason=limit_exhausted
            details="повтор через «Re-run failed jobs» не проходит gate, модель не вызывалась. Для повтора нужен «Re-run all jobs»"
          elif [ "$CLAUDE_RESULT" = success ]; then
            echo "Agent finished, nothing to report"
            exit 0
          else
            job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "claude")][0]')
            started=$(jq -r '.started_at // empty' <<< "$job")
            completed=$(jq -r '.completed_at // empty' <<< "$job")
            failed_step=$(jq -r '[.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled")][0].name // empty' <<< "$job")
            elapsed=0
            if [ -n "$started" ] && [ -n "$completed" ]; then
              elapsed=$(( $(date -d "$completed" +%s) - $(date -d "$started" +%s) ))
            fi
            if [ "$elapsed" -ge $(( AGENT_TIMEOUT_MINUTES * 60 - 60 )) ]; then
              reason=timeout
              details="задание агента остановлено по timeout-minutes: $AGENT_TIMEOUT_MINUTES"
            elif [ "$failed_step" = "Run agent" ]; then
              reason=agent_failed
              details="агент завершился с ошибкой ($CLAUDE_RESULT)"
            elif [ -n "$failed_step" ]; then
              reason=infra
              details="сбой подготовки на шаге «$failed_step»"
            else
              reason=agent_failed
              details="задание агента завершилось со статусом $CLAUDE_RESULT"
            fi
          fi

          if [ "$IS_PR" = true ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.sha)
            budget="${USED:-?} из ${LIMIT:-?}"
          else
            sha="$GITHUB_SHA"
            budget="на issue предел не действует"
          fi
          log="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"

          body="$RUNNER_TEMP/report.md"
          {
            echo "### Агент не выполнил команду"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Причина | \`$reason\`: $details |"
            echo "| Допущено запусков агента | $budget |"
            echo "| Последний SHA | \`$sha\` |"
            echo "| Лог | $log |"
            echo "| Статус | **нужен человек** |"
          } > "$body"
          cat "$body"
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F "body=@$body" --silent
