name: e2e-head

# Проверка работающей версии PR: e2e в браузере на точном head SHA, а не на временном
# merge-коммите. Артефакт e2e-<sha> — доказательство для ревью: трассы, скриншоты и файл
# с SHA и результатом. ci.yml работает на push, это задание — на pull_request.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Новый push в PR отменяет проверку прежней версии.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Секреты не нужны: задание запускает только тесты проекта, поэтому оно работает и для PR из fork.
permissions:
  contents: read

jobs:
  e2e-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify checked out SHA
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "expected: $HEAD_SHA"
          echo "actual:   $actual"
          echo "ACTUAL_SHA=$actual" >> "$GITHUB_ENV"
          test "$actual" = "$HEAD_SHA"

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # E2E_EVIDENCE=1 включает в playwright.config.ts trace: 'on' и screenshot: 'on' для всех тестов.
      - name: End-to-end tests
        id: e2e
        env:
          E2E_EVIDENCE: '1'
        run: mise run e2e

      - name: Record SHA and result
        if: always()
        env:
          OUTCOME: ${{ steps.e2e.outcome }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "pr: $PR"
            echo "head_sha: $HEAD_SHA"
            echo "git_rev_parse_head: ${ACTUAL_SHA:-unknown}"
            echo "e2e: $OUTCOME"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee e2e/head-sha.txt
          {
            echo "### e2e на head SHA"
            echo
            echo '```'
            cat e2e/head-sha.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ github.event.pull_request.head.sha }}
          path: |
            e2e/head-sha.txt
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
