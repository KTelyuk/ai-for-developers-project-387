name: triage

# Автотриаж: агент Claude Code делает предварительный разбор нового обращения.
# Описание: README.md, раздел «Агент в GitHub».
on:
  issues:
    types: [opened]

# Один прогон на issue: повторное событие по тому же обращению ждёт текущий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  triage:
    # Разбираются только входящие обращения доверенных участников. Спецификации и тикеты,
    # подготовленные скиллами to-spec и to-tickets, несут метки spec или ready-for-agent
    # (docs/agents/issue-tracker.md) и повторного триажа не требуют. Issues от ботов,
    # включая тикеты, которые создал сам агент, тоже пропускаются.
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      github.event.issue.user.type != 'Bot' &&
      !contains(github.event.issue.labels.*.name, 'spec') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Комментарии и метки агент ставит токеном Claude GitHub App, а не GITHUB_TOKEN.
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # В prompt попадает только номер issue: заголовок и текст обращения агент читает сам через gh,
          # чтобы чужой текст не стал частью инструкции.
          prompt: |
            Новое обращение в GitHub Issues: #${{ github.event.issue.number }} в репозитории ${{ github.repository }}.
            Сделай его предварительный разбор по скиллу triage: прочитай .claude/skills/triage/SKILL.md
            и выполни шаги «Triage a specific issue or PR» с 1 по 3 (контекст, рекомендация, проверка заявления).
            Трекер и метки описаны в docs/agents/issue-tracker.md и docs/agents/triage-labels.md.

            1. Прочитай issue: gh issue view ${{ github.event.issue.number }} --json number,title,body,labels,author,comments.
            2. Проверь по коду и docs/spec.md, что приложение уже умеет в этой области, нет ли готовой реализации
               и не исключено ли это в Out of Scope спецификации. Термины бери из GLOSSARY.md.
            3. Оставь в issue один комментарий. Первая строка — «> *This was generated by AI during triage.*».
               Дальше: категория (bug или enhancement) с объяснением, что уже есть в приложении и где ты смотрел,
               оценка объёма, нумерованные вопросы о недостающих условиях и предлагаемый следующий шаг.
            4. Поставь категорию (bug или enhancement) и метку состояния: needs-info, если без ответов автора
               двигаться нельзя, иначе needs-triage. Метки ready-for-agent, ready-for-human и wontfix
               ставит только человек.

            Код, ветки и другие issues не меняй, скиллы to-spec, to-tickets и implement-spec не запускай.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh label list:*)"
